services:
  eventix_web_backend:
    build:
      context: ./backend
    environment:
      - API_PREFIX=/api
      - ENV=production
    expose:
      - "8000"
    volumes:
      - ./docs/STATE.md:/app/STATE.md:ro
    networks:
      - web

  eventix_web_frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    expose:
      - "80"
    networks:
      - web
    labels:
      caddy: "${CADDY_SCHEME-http://}eventix.${HOST_SUFFIX:-localhost}"
      caddy.0_reverse_proxy: "/api* eventix_web_backend:8000"
      caddy.1_reverse_proxy: "/mcp* eventix_web_backend:8000"
      caddy.2_reverse_proxy: "/state-doc* eventix_web_backend:8000"
      caddy.3_reverse_proxy: "eventix_web_frontend:80"
